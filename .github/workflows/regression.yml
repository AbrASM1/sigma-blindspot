name: SigmaHQ regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.21"
      - run: uv sync --locked
      - run: uv run python scripts/validate_regression.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: .cache/regression.md
          if-no-files-found: ignore
