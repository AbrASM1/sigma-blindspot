[project]
name = "sigma-blindspot"
version = "0.1.0"
description = "Static analyzer that proves which Sigma rules can never fire under a given Sysmon configuration."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pysigma>=1.5.1,<2",
    "z3-solver==5.1.0.0",
]

[project.scripts]
sigma-blindspot = "sigma_blindspot.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "tests"

[[tool.mypy.overrides]]
module = ["z3", "z3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
